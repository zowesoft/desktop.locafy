<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Apply the stored theme before first paint so the page never flashes the wrong one. -->
    <script>
      try {
        if (localStorage.getItem("locafy-theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (_) {}
    </script>
    <!--
      The stylesheet arrives with the script bundle, so paint the theme colour
      inline. Without it a light-theme user sees the dark window background
      until the bundle loads.
    -->
    <style>
      html { background: #111116; }
      html:not(.dark) { background: #f5f3f8; }
    </style>
    <title>Locafy</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111116 url("/splash.png") center/cover no-repeat;
        transition: opacity 180ms ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      // The splash holds for a fixed minimum so the brand is legible, then
      // fades once the app's first paint is observed in #root.
      (function () {
        var splash = document.getElementById("splash");
        var start = performance.now();
        var HOLD_MS = 1500;
        var mounted = false;
        function hide() {
          if (!splash || !mounted) return;
          var elapsed = performance.now() - start;
          if (elapsed < HOLD_MS) {
            setTimeout(hide, HOLD_MS - elapsed);
            return;
          }
          splash.classList.add("hidden");
          splash = null;
        }
        var observer = new MutationObserver(function () {
          if (document.getElementById("root").childElementCount > 0) {
            observer.disconnect();
            mounted = true;
            requestAnimationFrame(hide);
            setTimeout(function () {
              if (splash) splash.remove();
            }, 400);
          }
        });
        observer.observe(document.getElementById("root"), { childList: true });
        splash.addEventListener("transitionend", function () {
          splash.remove();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
