<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Apply the stored theme before first paint so the page never flashes the wrong one. -->
    <script>
      try {
        if (localStorage.getItem("locafy-theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (_) {}
    </script>
    <!--
      The stylesheet arrives with the script bundle, so paint the theme colour
      inline. Without it a light-theme user sees the dark window background
      until the bundle loads.
    -->
    <style>
      html { background: #111116; }
      html:not(.dark) { background: #f5f3f8; }
    </style>
    <title>Locafy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
